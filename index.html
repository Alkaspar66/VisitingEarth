<!-- Внутри <head> -->
<style>
  /* Центрируем соцсети */
  .social-icons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 16px 0;
  }

  /* Play Slideshow Button */
  .play-slideshow-btn {
    display: block;
    margin: 16px auto;
    padding: 10px 20px;
    font-size: 1rem;
    background-color: #1a73e8;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  /* Галерея — первая картинка адаптивная */
  .gallery-card:first-child .gallery-cover {
    max-width: 80vw; /* не шире 80% экрана */
    max-height: 60vh; /* не выше 60% высоты окна */
    margin: 0 auto; /* центрирование */
    display: block;
    object-fit: contain;
  }

  /* Карточки галереи */
  .gallery-card {
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    margin-bottom: 16px;
  }

  /* Остальные картинки в галерее */
  .gallery-cover {
    width: 100%;
    height: auto;
    display: block;
    object-fit: cover;
  }
</style>

<!-- Кнопка Play Slideshow -->
<div class="play-slideshow-container">
  <button class="play-slideshow-btn" id="play-slideshow">Play Slideshow</button>
</div>

<script>
  const playBtn = document.getElementById('play-slideshow');

  playBtn.addEventListener('click', () => {
    const firstGalleryLink = document.querySelector('.glightbox');
    if(firstGalleryLink) {
      const lightbox = GLightbox({
        selector: '.glightbox',
        loop: true,
      });
      lightbox.open(); // открытие слайдшоу с первой картинки
    }
  });
</script>
